<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- wordsy (brand FlipWord) logo: a card flipping. The card in front is a
     common card — the app's warm tile, its letter in the tile ink; the one
     behind it, turned and caught mid-flip, is a +1 rare card, the first flex
     color's wash with the color itself as its edge, as the board draws it.
     Hand-authored; no external source.

     The fills are COPIES of the daylight theme's tile shade 3 (fill #F2E8CE,
     edge #E1C88E), its tile ink (#1A1A1A), its first flex color (#00695C) and
     that color's wash (#D1E0DC: 20% over white, in oklab), because an SVG
     file cannot read CSS custom properties. Keep them in step by hand.

     The two cards fill the square between them, so the logo has no
     letterboxing in the app's square slots, and the letter is heavy because
     it is read at 40px in a club list. -->
<svg
   role="img"
   aria-label="FlipWord"
   viewBox="0 0 2000 2000"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- The card behind, turned partway: the +1's wash, edged in its color. -->
  <rect x="1020" y="140" width="820" height="1280" rx="140" ry="140"
        fill="#D1E0DC" stroke="#00695C" stroke-width="60" transform="rotate(14 1430 780)"/>
  <!-- The card in front: the warm tile, with its letter. -->
  <rect x="190" y="590" width="1040" height="1240" rx="150" ry="150"
        fill="#F2E8CE" stroke="#E1C88E" stroke-width="60"/>
  <text x="710" y="1530" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="1000"
        fill="#1A1A1A">W</text>
</svg>
